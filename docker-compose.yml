services:
  itlg-claim:
    build: .
    container_name: itlg-claim
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - itlg-data:/app/data
    environment:
      AUTH_MODE: ${AUTH_MODE:-}
      USERGATE_API_KEY: ${USERGATE_API_KEY:-}
      USERGATE_BASE_URL: ${USERGATE_BASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Asia/Jakarta}
      ITLG_API_BASE: ${ITLG_API_BASE:-https://prod.interlinklabs.ai/api/v1}
      ITLG_DATA_DIR: ${ITLG_DATA_DIR:-/app/data}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  itlg-data:
